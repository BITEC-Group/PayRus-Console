<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A2F5C" />
    <title>Offline — PayRus Operations Platform</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: system-ui, "Segoe UI", sans-serif;
        display: flex; align-items: center; justify-content: center; min-height: 100vh;
        background: #f7faf8; color: #0a2f5c;
      }
      main { text-align: center; padding: 2rem; max-width: 420px; }
      .icon {
        width: 64px; height: 64px; margin: 0 auto 1.5rem; border-radius: 50%;
        background: #e6ebf2; display: flex; align-items: center; justify-content: center;
      }
      .icon svg { width: 32px; height: 32px; stroke: #0a2f5c; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
      p { color: #4a5d73; margin-bottom: 1.5rem; line-height: 1.5; }
      button {
        background: #0a2f5c; color: #fff; border: none; padding: 0.75rem 2rem; border-radius: 0.75rem;
        font: inherit; font-weight: 600; cursor: pointer;
      }
      button:hover { background: #0e3a6b; }
      button:focus-visible { outline: 3px solid #0b6a96; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <line x1="1" y1="1" x2="23" y2="23" />
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
          <path d="M10.71 5.05A16 16 0 0 1 22.56 9" />
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>
      <h1 id="title">You're offline</h1>
      <p id="body">Please check your internet connection and try again.</p>
      <button id="retry" type="button">Try again</button>
    </main>
    <script>
      var copy = {
        fr: ["Vous êtes hors ligne", "Vérifiez votre connexion internet et réessayez.", "Réessayer"],
        pt: ["Está sem ligação", "Verifique a sua ligação à internet e tente novamente.", "Tentar novamente"],
        es: ["Sin conexión", "Compruebe su conexión a internet e inténtelo de nuevo.", "Reintentar"],
      };
      var lang = (navigator.language || "en").slice(0, 2);
      var c = copy[lang];
      if (c) {
        document.documentElement.lang = lang;
        document.getElementById("title").textContent = c[0];
        document.getElementById("body").textContent = c[1];
        document.getElementById("retry").textContent = c[2];
      }
      document.getElementById("retry").addEventListener("click", function () { window.location.reload(); });
    </script>
  </body>
</html>
